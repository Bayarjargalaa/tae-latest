{% comment %}Тайлангийн нийтлэг загвар (.sr-*) - Борлуулалтын тайлан, Татан авалтын тайлан. Токен: ангиллын series-1/2/3 - validate_palette-аар шалгасан.{% endcomment %}
<style>
    /* Токен: ангиллын series-1/2, дараалсан шат - validate_palette-аар шалгасан. Бичвэр цувааны өнгө авахгүй */
    .sr-root { --ink: #111827; --ink-2: #4b5563; --muted: #6b7280; --grid: #eeeeec; --axis: #d1d5db; --hairline: rgba(17,24,39,.08);
               --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --good-text: #006300; --good-bg: #e8f5e9; --bad-text: #b42323; --bad-bg: #fdecec;
               --canvas: #f7f7f5; color: var(--ink); }
    .sr-card { background: #fff; border: 1px solid var(--hairline); border-radius: 1rem; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
    .sr-card h3 { font-size: .95rem; font-weight: 600; }
    .sr-sub { font-size: .75rem; color: var(--muted); }
    .sr-num { font-variant-numeric: tabular-nums; }
    .sr-label { display: block; font-size: .7rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin-bottom: .3rem; }
    .sr-field { border: 1px solid #e5e7eb; border-radius: .6rem; padding: .45rem .7rem; font-size: .875rem; background: #fff; }
    .sr-field:focus { outline: 2px solid rgba(42,120,214,.35); border-color: var(--series-1); }
    .seg { display: inline-flex; padding: 3px; gap: 2px; background: #f1f1ef; border-radius: .7rem; flex-wrap: wrap; max-width: 100%; }
    .seg button { font-size: .8rem; padding: .35rem .75rem; border-radius: .55rem; color: var(--ink-2); font-weight: 500; white-space: nowrap; }
    .seg button:hover { color: var(--ink); }
    .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
    .sr-root .choices { margin-bottom: 0; }
    .sr-root .choices__inner { min-height: 38px; border-radius: .6rem; background: #fff; padding: 3px 6px; font-size: .85rem; }
    .sr-root .choices__list--multiple .choices__item { background: #2a78d6; border-color: #2a78d6; border-radius: 999px; font-size: .75rem; }
    .kpi-value { font-size: clamp(1.05rem, 1.45vw, 1.5rem); font-weight: 650; letter-spacing: -.015em; line-height: 1.2; }
    @media (min-width: 768px) { .kpi-value { white-space: nowrap; } }
    .delta { display: inline-flex; align-items: center; gap: .2rem; font-size: .72rem; font-weight: 600; padding: .1rem .45rem; border-radius: 999px; }
    .delta.up { color: var(--good-text); background: var(--good-bg); } .delta.down { color: var(--bad-text); background: var(--bad-bg); }
    .delta.flat { color: var(--ink-2); background: #f3f4f6; }
    .tabs { display: flex; gap: .15rem; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid #e7e5e4; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs a { padding: .7rem .95rem; font-size: .875rem; font-weight: 500; color: var(--ink-2); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .tabs a:hover { color: var(--ink); }
    .tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--series-1); font-weight: 600; }
    .bar-row { display: grid; grid-template-columns: minmax(0, 46%) 1fr auto; align-items: center; gap: .6rem; padding: .3rem .4rem; border-radius: .5rem; cursor: pointer; }
    .bar-row:hover, .bar-row:focus-visible { background: var(--canvas); outline: none; }
    .bar-label { font-size: .8rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-rank { color: var(--muted); margin-right: .35rem; font-variant-numeric: tabular-nums; }
    .bar-track { height: 12px; position: relative; }
    .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; transition: width .35s ease; }
    .bar-value { font-size: .78rem; color: var(--ink-2); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .chart-wrap { position: relative; }
    .chart-wrap svg { display: block; width: 100%; height: 280px; overflow: visible; }
    .grid-line { stroke: var(--grid); }
    .axis-text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
    .tooltip { position: absolute; pointer-events: none; background: #111827; color: #fff; font-size: .75rem; padding: .45rem .6rem; border-radius: .5rem;
               box-shadow: 0 6px 20px rgba(0,0,0,.18); white-space: nowrap; z-index: 20; transform: translate(-50%, calc(-100% - 10px)); opacity: 0; transition: opacity .1s; }
    .tooltip.show { opacity: 1; }
    .tooltip .t-head { font-weight: 600; margin-bottom: .2rem; }
    .tooltip .t-row { display: flex; gap: .6rem; justify-content: space-between; align-items: center; }
    .tooltip i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: .3rem; }
    .legend { display: flex; gap: 1rem; font-size: .75rem; color: var(--ink-2); flex-wrap: wrap; }
    .legend span { display: inline-flex; align-items: center; gap: .35rem; }
    .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
    .sr-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: .82rem; }
    .sr-table thead th { position: sticky; top: 0; z-index: 2; background: #fafaf9; color: var(--ink-2); font-weight: 600; font-size: .7rem; text-transform: uppercase;
                         letter-spacing: .03em; padding: .6rem .7rem; border-bottom: 1px solid #e7e5e4; text-align: right; white-space: nowrap; user-select: none; }
    .sr-table thead th.l { text-align: left; }
    .sr-table thead th[data-sort] { cursor: pointer; }
    .sr-table thead th[data-sort]:hover { color: var(--ink); }
    .sr-table thead th .arrow { opacity: .35; margin-left: .2rem; font-size: .65rem; }
    .sr-table thead th.sorted .arrow { opacity: 1; color: var(--series-1); }
    .sr-table tbody td { padding: .5rem .6rem; border-bottom: 1px solid #f1f1ef; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sr-table tbody td.l { text-align: left; }
    .sr-table tbody tr.click { cursor: pointer; }
    .sr-table tbody tr:hover { background: #f8fafc; }
    .sr-table tfoot td { position: sticky; bottom: 0; background: #fafaf9; padding: .6rem .7rem; font-weight: 650; text-align: right; border-top: 1px solid #e7e5e4; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sr-table tfoot td.l { text-align: left; }
    .sr-table tr.year-row td { background: #f3f7fd; font-weight: 600; cursor: pointer; }
    .sr-table tr.year-row:hover td { background: #e8f0fb; }
    .neg { color: var(--bad-text); }
    .name-cell { max-width: 20rem; overflow: hidden; text-overflow: ellipsis; }
    .share { display: inline-flex; align-items: center; gap: .4rem; justify-content: flex-end; }
    .share .mini { width: 46px; height: 6px; background: #efefec; border-radius: 999px; overflow: hidden; }
    .share .mini b { display: block; height: 100%; background: var(--series-1); border-radius: 999px; }
    .chip { display: inline-block; font-size: .68rem; color: var(--ink-2); background: #f3f4f6; border-radius: 999px; padding: .05rem .45rem; margin-left: .35rem; vertical-align: middle; }
    .table-scroll { max-height: 72vh; overflow: auto; }
    .fade-in { animation: fadeIn .3s ease both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .fade-in, .bar-fill { animation: none; transition: none; } }
    @media print {
        #sidebar, #sidebar-open-button, #sidebar-overlay, header, footer, .no-print, #ai-chat-widget { display: none !important; }
        main { margin: 0 !important; padding: 0 !important; }
        .table-scroll { max-height: none; overflow: visible; }
        .sr-card { box-shadow: none; break-inside: avoid; }
    }
</style>
