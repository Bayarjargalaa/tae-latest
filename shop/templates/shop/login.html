{% extends 'base.html' %}

{% block title %}Нэвтрэх - EuroFoods{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6 sm:py-12">
    <div class="max-w-md mx-auto bg-white rounded-lg shadow-md p-5 sm:p-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-center mb-6">Нэвтрэх</h1>
        
        {% if form.errors %}
        <div class="bg-red-100 text-red-800 p-4 rounded-lg mb-4">
            Нэвтрэх нэр эсвэл нууц үг буруу байна.
        </div>
        {% endif %}
        
        <form method="post" class="space-y-4">
            {% csrf_token %}
            
            <!-- Email -->
            <div>
                <label class="block text-sm font-medium mb-2">Имэйл хаяг</label>
                <input type="email" name="username" required
                       class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent"
                       placeholder="example@mail.com">
            </div>
            
            <!-- Password -->
            <div>
                <label class="block text-sm font-medium mb-2">Нууц үг</label>
                <div class="relative">
                    <input type="password" id="password" name="password" required
                           class="w-full px-4 py-3 pr-12 border rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                    <button type="button" 
                            onclick="togglePassword('password', 'eyeIcon')"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 focus:outline-none"
                            style="min-height: 44px; min-width: 44px;">
                        <svg id="eyeIcon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <div class="text-right mt-2">
                    <a href="{% url 'shop:password_reset' %}" 
                       class="text-sm text-primary hover:underline inline-block py-2"
                       style="min-height: 44px; line-height: 28px;">
                        Нууц үг мартсан?
                    </a>
                </div>
            </div>
            
            <!-- Submit -->
            <button type="submit" class="w-full bg-primary text-white py-3 rounded-lg hover:bg-green-700 font-bold" style="min-height: 48px; font-size: 16px;">
                Нэвтрэх
            </button>
        </form>
        
        <p class="text-center mt-6 text-gray-600">
            Бүртгэлгүй юу? <a href="{% url 'shop:register' %}" class="text-primary hover:underline font-medium inline-block py-2" style="min-height: 44px; line-height: 28px;">Бүртгүүлэх</a>
        </p>
    </div>
</div>

<script>
function togglePassword(inputId, iconId) {
    const passwordInput = document.getElementById(inputId);
    const eyeIcon = document.getElementById(iconId);
    
    if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        // Eye slash icon (нуух)
        eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
        `;
    } else {
        passwordInput.type = 'password';
        // Eye icon (харуулах)
        eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
        `;
    }
}
</script>
{% endblock %}
