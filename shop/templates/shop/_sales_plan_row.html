{# Төлөвлөгөөт барааны мөр. item хоосон бол (<template> дотор) JS нэр, код, хайрцаг дахь тоог бөглөнө. #}
<tr data-item="{{ item.id }}">
    {# Дугаар ба нэр - хэвтээ гүйлгэхэд зүүн талдаа тогтмол #}
    <td class="sticky left-0 z-10 bg-white px-2 py-1.5 shadow-[inset_-1px_0_0_#e5e7eb]">
        <div class="flex gap-2">
            <span class="w-6 shrink-0 text-right text-gray-400 tabular-nums" data-row-no></span>
            <div class="min-w-0"><input type="hidden" name="items" value="{{ item.id }}"><div class="truncate max-w-[16rem]" data-name title="{{ item.name }}">{{ item.name }}</div><div class="text-[11px] text-gray-400" data-code>{{ item.id }}</div></div>
        </div>
    </td>
    <td class="px-2 py-1.5 text-right whitespace-nowrap">
        <input type="text" inputmode="decimal" data-per-box value="{{ item.per_box }}" placeholder="гараар" class="w-16 text-right tabular-nums border rounded px-2 py-1 border-gray-300"> <span class="text-xs text-gray-500" data-unit-label>{{ item.unit }}</span>
        <div class="text-[10px] text-gray-400" data-source>{{ item.source }}</div>
    </td>
    <td class="px-2 py-1.5">
        <select data-unit-mode class="border border-gray-300 rounded px-1 py-1 text-xs">
            <option value="box" {% if item.unit_mode != 'pcs' %}selected{% endif %}>хайрцаг</option>
            <option value="pcs" {% if item.unit_mode == 'pcs' %}selected{% endif %}>ширхэг</option>
        </select>
    </td>
    {% for cell in item.cells %}
    <td class="px-2 py-1.5 text-right align-top" data-col="{{ forloop.counter0 }}">
        <input type="text" inputmode="decimal" data-qty value="{{ cell.value }}" class="w-16 text-right tabular-nums border border-gray-300 rounded px-2 py-1 disabled:bg-gray-100 disabled:text-gray-300">
        <div class="text-[10px] text-gray-500 tabular-nums h-3" data-conv></div>
        {# Тухайн сард энэ сувагт зарагдсан тоо (ширхэг) #}
        <div class="text-[10px] tabular-nums whitespace-nowrap text-gray-400" data-sold="{{ cell.sold }}">{% if cell.sold %}зарсан {{ cell.sold }}{% endif %}</div>
    </td>
    {% endfor %}
    <td class="px-2 py-1.5 text-right tabular-nums font-semibold whitespace-nowrap" data-row-boxes></td>
    <td class="px-2 py-1.5 text-right tabular-nums text-gray-600 whitespace-nowrap" data-row-units></td>
    <td class="px-2 py-1.5 text-right tabular-nums whitespace-nowrap" data-row-sold="{{ item.sold_total }}">
        <div class="text-gray-700">{{ item.sold_total }}</div><div class="text-[10px]" data-row-pct></div>
    </td>
    <td class="px-2 py-1.5 text-right"><button type="button" data-remove class="text-red-600 hover:bg-red-50 rounded px-2 py-1" title="Хасах">✕</button></td>
</tr>
